# Restreamer self-hosted en VPS de Adolfo
#
# Usa la imagen oficial datarhei/restreamer:latest (pre-built).
# Si en el futuro modificas UI/core, cambia la línea `image:` por `build: .`
# para usar el Dockerfile del fork.
#
# Port mapping (8080 está ocupado por strategy_appsmith):
#   8085 → 8080  HTTP UI
#   8186 → 8181  HTTPS UI
#   1935 → 1935  RTMP server
#   1936 → 1936  RTMPS
#   6000 → 6000  SRT (UDP)

services:
  restreamer:
    image: datarhei/restreamer:latest
    container_name: restreamer
    restart: unless-stopped
    networks:
      # Red propia + red de juntas_nginx para que nginx alcance al container
      # via nombre 'restreamer:8080' sin exponer 8080 al internet público.
      - default
      - juntas
    ports:
      # NO exponer 8080/8181 al host — nginx HTTPS los alcanza via Docker network
      # interno. Solo RTMP/SRT siguen públicos para OBS/cámaras externas.
      - "1935:1935"
      - "1936:1936"
      - "6000:6000/udp"
    volumes:
      - ./data:/core/data
      - ./config:/core/config
      # UI custom (MolloStream — paleta Mocha + branding) — override del UI built-in
      # de la imagen oficial. Para revertir al UI vanilla, comentar esta línea.
      - /root/projects/restreamer-ui/build:/core/ui:ro
    environment:
      # Auth IAM v3 — REQUIERE enable=true para que las credenciales se apliquen
      # El password aquí solo se usa la primera vez (cuando db.json está vacío).
      # Cambios posteriores se hacen via UI en /ui/iam o reset borrando db.json.
      CORE_API_AUTH_ENABLE: "true"
      CORE_API_AUTH_USERNAME: ${CORE_API_AUTH_USERNAME}
      CORE_API_AUTH_PASSWORD: ${CORE_API_AUTH_PASSWORD}
      # Resource limits suaves (FFmpeg puede ser pesado)
      CORE_FFMPEG_LOG_MAX_LINES: "50"
    # Si tienes GPU disponible, descomenta para hardware accel:
    # devices:
    #   - /dev/dri:/dev/dri

networks:
  default:
    # Red propia del container — para futuros workers FFmpeg si los agregamos
    driver: bridge
  juntas:
    # Red externa donde vive juntas_nginx — para que el reverse proxy nos alcance
    external: true
    name: juntas-app_juntas_net
